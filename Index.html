</style><script>
(function(){
'use strict';
const pads=[...document.querySelectorAll('.pad')],knobs=[...document.querySelectorAll('.knob')],tracks=[...document.querySelectorAll('[data-track]')];
const left=document.getElementById('displayleft'),right=document.getElementById('displayright'),transport=document.getElementById('transport'),bpm=document.getElementById('bpm'),notice=document.getElementById('notice');
const leftBtns=[...document.querySelectorAll('#leftcol button')],rightBtns=[...document.querySelectorAll('#rightcol button')];
const state={playing:false,recording:false,tempo:120,step:0,track:0,mode:'STEP',page:1,bank:'A',values:[100,3,50,100,64,64,64,64,1],patterns:Array.from({length:16},()=>Array.from({length:4},()=>Array.from({length:8},()=>Array(16).fill(false)))),clipboard:null,second:false,muted:new Set(),undo:[],lastTick:performance.now()};
function matrix(){return state.patterns[state.track][state.page-1]}
function saveUndo(){state.undo.push(matrix().map(row=>row.slice()));if(state.undo.length>20)state.undo.shift()}
function setNotice(s){notice.textContent=s}
function render(){
 const s=state;
 left.innerHTML='<div class="micro">Squarp instruments</div><div class="brand">HAPAX</div><div class="screen-title">'+s.mode+' · TRK '+String(s.track+1).padStart(2,'0')+'</div><div class="screen-data">BPM '+s.tempo+'　PAGE '+s.page+'/4<br>VELOCITY '+s.values[0]+'　OCT '+s.values[1]+'<br>BANK '+s.bank+'　'+(s.recording?'● REC':'')+(s.muted.has(s.track)?' MUTE':'')+'</div>';
 right.innerHTML='<div class="micro">polychronic performance sequencer</div><div class="screen-title">PROJECT '+s.bank+' · '+(s.playing?'PLAY':'STOP')+'</div><div class="screen-data">TRACK '+(s.track+1)+'/16<br>STEP '+String(s.step+1).padStart(2,'0')+'/16<br>KNOB 9 '+s.values[8]+'<br>MODE '+s.mode+'</div>';
 transport.textContent=s.playing?'■ STOP':'▶ PLAY';transport.classList.toggle('transport-on',s.playing);bpm.value=s.tempo;
 tracks.forEach((t,i)=>t.classList.toggle('selected',i===s.track));
 pads.forEach(p=>{let r=+p.dataset.row,c=+p.dataset.col;p.classList.toggle('on',matrix()[r][c]);p.classList.toggle('head',s.playing&&c===s.step);p.classList.toggle('pattern',s.mode==='PATTERN'&&matrix()[r][c]);});
 knobs.forEach((k,i)=>{let a=-135+270*s.values[i]/127;k.style.setProperty('--angle',a+'deg');k.setAttribute('aria-label','Encodeur '+(i+1)+' : '+s.values[i]);k.title='Encodeur '+(i+1)+' : '+s.values[i]});
 leftBtns.forEach(b=>b.classList.toggle('active',(b.textContent.trim()==='REC'&&s.recording)||(b.textContent.trim()==='MUTE'&&s.muted.has(s.track))||(b.textContent.trim()==='2ND'&&s.second)));
 rightBtns.forEach(b=>b.classList.toggle('mode-active',b.textContent.trim()===s.mode||b.textContent.trim()===s.bank));
}
function togglePlay(){state.playing=!state.playing;state.lastTick=performance.now();render()}
function stop(){state.playing=false;state.step=0;render()}
function clear(){saveUndo();matrix().forEach(row=>row.fill(false));setNotice('Page '+state.page+' effacée · UNDO pour annuler');render()}
transport.addEventListener('click',togglePlay);
document.getElementById('reset').addEventListener('click',clear);
bpm.addEventListener('change',()=>{let n=Number(bpm.value);state.tempo=Number.isFinite(n)?Math.max(30,Math.min(300,Math.round(n))):120;render()});
tracks.forEach((t,i)=>t.addEventListener('click',()=>{state.track=i;state.undo=[];render()}));
pads.forEach(p=>p.addEventListener('click',()=>{let r=+p.dataset.row,c=+p.dataset.col;saveUndo();matrix()[r][c]=!matrix()[r][c];render()}));
leftBtns.forEach(b=>b.addEventListener('click',()=>{let t=b.textContent.trim();switch(t){
case '▶':togglePlay();return;case '■':stop();return;case '●':state.recording=!state.recording;break;case 'REC':state.recording=!state.recording;break;
case '2ND':state.second=!state.second;break;case 'MUTE':state.muted.has(state.track)?state.muted.delete(state.track):state.muted.add(state.track);break;
case 'COPY':state.clipboard=matrix().map(row=>row.slice());setNotice('Page copiée');break;
case 'PASTE':if(state.clipboard){saveUndo();state.patterns[state.track][state.page-1]=state.clipboard.map(row=>row.slice());setNotice('Page collée')}else setNotice('Rien à coller');break;
case 'DELETE':clear();return;
case 'ALGO':saveUndo();matrix().forEach((row,r)=>row.forEach((_,c)=>row[c]=(c%4===0&&r===7)));setNotice('Rythme de démonstration créé');break;
default:setNotice('Commande '+(t||'libre')+' non simulée');break;}render()}));
rightBtns.forEach(b=>b.addEventListener('click',()=>{let t=b.textContent.trim();if(['STEP','LIVE','AUTOM','PATTERN'].includes(t))state.mode=t;
else if(t==='A'||t==='B')state.bank=t;
else if(t==='→'||t==='+')state.page=state.page%4+1;
else if(t==='←'||t==='-')state.page=(state.page+2)%4+1;
else if(t==='UNDO'){let prev=state.undo.pop();if(prev)state.patterns[state.track][state.page-1]=prev;else setNotice('Rien à annuler')}
else if(t==='BPM'){bpm.focus();bpm.select();setNotice('Modifier le tempo dans BPM en bas')}
else if(t==='↑'){state.track=(state.track+15)%16}
else if(t==='↓'){state.track=(state.track+1)%16}
else setNotice(t+' : commande non simulée');render()}));
knobs.forEach((k,i)=>{let startY=0,startVal=0,dragged=false;
 k.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;startY=e.clientY;startVal=state.values[i];dragged=false;k.setPointerCapture(e.pointerId)});
 k.addEventListener('pointermove',e=>{if(!k.hasPointerCapture(e.pointerId))return;let diff=Math.round((startY-e.clientY)/4);if(diff!==0){dragged=true;state.values[i]=Math.max(0,Math.min(127,startVal+diff));render()}});
 k.addEventListener('pointerup',()=>{if(!dragged){state.values[i]=(state.values[i]+1)%128;render()}});
 k.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();state.values[i]=Math.max(0,Math.min(127,state.values[i]+(e.key==='ArrowUp'||e.key==='ArrowRight'?1:-1)));render()}});
});
function tick(now){if(state.playing){const interval=60000/(state.tempo*4);let count=0;while(now-state.lastTick>=interval&&count++<32){state.step=(state.step+1)%16;state.lastTick+=interval}if(count>32)state.lastTick=now;render()}else state.lastTick=now;requestAnimationFrame(tick)}
render();requestAnimationFrame(tick);
